name: Build CE Android

on:
  workflow_dispatch:
  push:
    branches:
      - ce-arabic-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned CE APK
        run: flutter build apk --release --no-pub

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/CE-unsigned.apk

      - name: Upload CE APK
        uses: actions/upload-artifact@v4
        with:
          name: CE-unsigned-apk
          path: dist/CE-unsigned.apk
          if-no-files-found: error
